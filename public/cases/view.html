<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>案例详情</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0c0c0c;
        color: #d7e2ea;
        font-family: 'Kanit', 'Noto Sans SC', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }
      .stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(ellipse 60% 50% at 50% 40%, rgba(182, 0, 168, 0.14), transparent 70%),
          radial-gradient(ellipse 50% 40% at 70% 70%, rgba(76, 91, 255, 0.12), transparent 70%);
        pointer-events: none;
      }
      img {
        position: relative;
        max-width: 92vw;
        max-height: 78vh;
        object-fit: contain;
        border-radius: 16px;
        box-shadow: 0 40px 120px -30px rgba(0, 0, 0, 0.9);
      }
      .title {
        position: relative;
        font-size: 15px;
        letter-spacing: 0.15em;
        color: rgba(215, 226, 234, 0.65);
        text-align: center;
      }
      .bar {
        position: absolute;
        top: 20px;
        left: 24px;
        right: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      button {
        cursor: pointer;
        border: 1px solid rgba(215, 226, 234, 0.25);
        background: rgba(22, 22, 27, 0.7);
        color: #d7e2ea;
        padding: 9px 22px;
        border-radius: 999px;
        font-size: 13px;
        letter-spacing: 0.1em;
        backdrop-filter: blur(10px);
        transition: all 0.25s ease;
      }
      button:hover {
        border-color: rgba(182, 0, 168, 0.7);
        box-shadow: 0 0 24px rgba(182, 0, 168, 0.35);
      }
      .brand {
        font-size: 12px;
        letter-spacing: 0.25em;
        color: rgba(215, 226, 234, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bar">
        <span class="brand">CAO ZHENG · 案例详情</span>
        <button id="back" onclick="if (history.length > 1) history.back(); else window.close();">返回</button>
      </div>
      <img id="img" alt="案例大图" />
      <p class="title" id="title"></p>
    </div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var img = q.get('img') || '';
        var title = q.get('title') || '案例详情';
        var el = document.getElementById('img');
        var t = document.getElementById('title');
        if (img) el.src = img;
        t.textContent = title;
        document.title = title + ' · 案例详情';
      })();
    </script>
  </body>
</html>
